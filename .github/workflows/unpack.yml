name: Unpack Android Project

on:
  push:
    paths:
      - 'alfarajia-android-project.zip'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack project
        run: |
          rm -rf /tmp/alfarajia-android
          unzip -q alfarajia-android-project.zip -d /tmp
          cp -a /tmp/alfarajia-android/. .
          rm -f alfarajia-android-project.zip

      - name: Commit project files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Unpack Android project"
          git push
